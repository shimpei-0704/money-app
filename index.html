<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<style>
  :root{
    --bg:#101214; --surface:#1B1F22; --surface-2:#262B2F;
    --text:#EDEFEF; --text-sub:#9AA1A6; --border:#2E3338;
    --primary:#2FA98C; --primary-dark:#22806B;
    --success:#3CB88F; --success-bg:#173029;
    --danger:#E0855F; --danger-bg:#3A241D; --danger-strong:#B9542E;
    --accent-bg:#1D2E2A;
    --radius:14px; --radius-sm:10px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  input, select, button{ font-family:inherit; font-size:15px; }
  input[type="date"]{ width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; }
  #app{ overflow-x:hidden; }
  #app{ max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---- Auth ---- */
  #authScreen{ display:none; flex-direction:column; justify-content:center; min-height:100vh; padding:32px 24px; }
  #authScreen h1{ font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:.02em; }
  #authScreen p.sub{ color:var(--text-sub); margin:0 0 28px; font-size:14px; }
  #loadingScreen{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
  #loadingScreen .spin{ width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-sub); margin-bottom:5px; }
  .field input{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }
  .field input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .btn-primary{ width:100%; padding:13px 0; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); font-weight:600; font-size:15px; cursor:pointer; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-secondary{ width:100%; padding:12px 0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; color:var(--text); cursor:pointer; }
  #authError{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }
  #authToggle{ text-align:center; margin-top:18px; font-size:13px; color:var(--primary); text-decoration:underline; cursor:pointer; }

  /* ---- Shell ---- */
  #shell{ display:none; flex-direction:column; flex:1; min-height:100vh; }
  #screenArea{ flex:1; overflow-y:auto; padding:18px 16px 90px; }
  h2.screen-title{ font-size:20px; font-weight:700; margin:0 0 16px; }
  #screenArea > h2.screen-title:not(:first-child){ margin-top:30px; padding-top:22px; border-top:1px solid var(--border); }

  /* ---- Tab bar ---- */
  #tabbar{ position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); max-width:480px; margin:0 auto; }
  .tab-btn{ flex:1; border:none; background:none; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-sub); cursor:pointer; min-width:0; }
  .tab-btn svg{ width:21px; height:21px; }
  .tab-btn span{ font-size:10px; white-space:nowrap; }
  .tab-btn.active{ color:var(--primary); }

  /* ---- Cards ---- */
  .card{ background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; border:1px solid var(--border); }
  .card-label{ font-size:12px; color:var(--text-sub); margin-bottom:6px; }
  .card-value{ font-size:20px; font-weight:700; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .row3 .card{ padding:12px 10px; min-width:0; }
  .row3 .card-value{ font-size:14px; text-align:right; white-space:nowrap; }
  .progress-track{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .progress-fill{ height:100%; background:var(--success); border-radius:4px; }
  .fixed-item{ padding:9px 0; border-bottom:1px solid var(--border); }
  .fixed-item:last-child{ border-bottom:none; }
  .fixed-item-row{ display:flex; align-items:center; gap:10px; }
  .fixed-day{ flex:0 0 auto; width:46px; height:46px; border-radius:10px; background:var(--accent-bg); color:var(--primary); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .fixed-day .num{ font-size:16px; font-weight:700; }
  .fixed-day .unit{ font-size:9px; }
  .fixed-day.due-today{ background:var(--danger-strong); color:#fff; }
  .fixed-info{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .fixed-info .name{ font-size:14px; }
  .fixed-amount{ flex:0 0 auto; font-size:14px; font-weight:600; text-align:right; }
  .fixed-check{ flex:0 0 auto; width:20px; height:20px; }
  .tag{ font-size:10px; background:var(--accent-bg); color:var(--primary); padding:3px 9px; border-radius:20px; }
  .account-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .account-tile{ background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 8px; min-width:0; }
  .account-tile .aname{ font-size:10px; color:var(--text-sub); margin-bottom:4px; display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .account-tile .aname .dot{ width:6px; height:6px; border-radius:50%; background:var(--primary); flex:0 0 auto; }
  .account-tile .abal{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
  .account-tile .abal.neg{ color:var(--danger); }
  .days-left{ font-weight:600; font-size:13px; }
  .days-left.soon{ color:var(--danger); }

  /* ---- Calendar ---- */
  .an-sub{ font-size:11px; color:var(--text-sub); padding-bottom:6px; line-height:1.6; }
  .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-header button{ background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:4px 10px; }
  .cal-header .ym{ font-size:16px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow{ font-size:11px; color:var(--text-sub); padding:4px 0; }
  .cal-cell{ border-radius:8px; padding:6px 0 4px; min-height:44px; cursor:pointer; font-size:13px; position:relative; }
  .cal-cell.empty{ cursor:default; }
  .cal-cell .amt{ font-size:9px; color:var(--text-sub); display:block; margin-top:2px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-sub); margin-top:10px; }
  .legend .sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .cat-select-btn{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:20px; padding:6px 12px; font-size:13px; }
  .cat-select-panel{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:14px; }
  .cat-select-group-label{ font-size:11px; color:var(--text-sub); margin:8px 0 4px; }
  .cat-select-group-label:first-child{ margin-top:0; }
  .cat-select-opt{ display:flex; align-items:center; gap:6px; font-size:13px; padding:4px 0; }
  .cat-select-opt input{ width:auto; }
  .list-record-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); }
  .filter-row select, .filter-row input{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:13px; }

  /* ---- Modal ---- */
  #modalOverlay{ display:none; position:fixed; inset:0; background:rgba(20,20,15,.45); align-items:center; justify-content:center; padding:20px; z-index:50; }
  #modalOverlay.show{ display:flex; }
  .modal-box{ background:var(--surface); border-radius:var(--radius); padding:16px; width:100%; max-width:360px; max-height:70vh; overflow-y:auto; }
  .modal-box .mh{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .modal-box .mh span{ font-weight:700; font-size:15px; }
  .modal-box .mh button{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-sub); }
  .swipe-row{ position:relative; overflow:hidden; border-bottom:1px solid var(--border); }
  .swipe-inner{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; background:var(--surface); transition:transform .15s; touch-action:pan-y; }
  .swipe-del{ position:absolute; right:0; top:0; bottom:0; width:70px; background:var(--danger); color:#fff; border:none; font-size:13px; }
  .swipe-inner .cat{ font-size:13px; }
  .swipe-inner .amt{ font-size:13px; font-weight:600; }
  .swipe-inner .amt.plus{ color:var(--success); }
  .swipe-inner .amt.minus{ color:var(--danger); }

  /* ---- Input screen ---- */
  .type-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .type-toggle button{ flex:1; padding:10px 0; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-weight:600; font-size:14px; cursor:pointer; color:var(--text-sub); }
  .type-toggle button.active.expense{ background:var(--danger-bg); border-color:var(--danger-strong); color:var(--danger); }
  .type-toggle button.active.income{ background:var(--success-bg); border-color:var(--success); color:var(--success); }
  .type-toggle button.active.advance{ background:var(--accent-bg); border-color:var(--primary); color:var(--primary); }
  .field select{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }

  /* ---- Summary ---- */
  #rangeBtn{ width:100%; text-align:left; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; cursor:pointer; font-size:13px; color:var(--text); }
  #rangeCalWrap{ display:none; margin-bottom:14px; }
  .cal-header #rangeBtn{ width:auto; flex:1; margin:0 6px; justify-content:center; gap:8px; font-size:14px; font-weight:700; padding:9px 10px; }
  .cat-bars{ margin-bottom:18px; }
  .cat-bar-row{ margin-bottom:10px; }
  .cat-bar-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:4px; gap:8px; }
  .cat-bar-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-bar-val{ flex:0 0 auto; font-weight:600; }
  .cat-bar-pct{ font-size:11px; color:var(--text-sub); font-weight:400; margin-left:8px; display:inline-block; min-width:30px; text-align:right; }
  .cat-bar-track{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:4px; }
  .pie-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .pie-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; justify-content:center; font-size:12px; margin-bottom:18px; }
  .bar-chart{ display:flex; align-items:flex-end; gap:4px; height:100px; border-top:1px solid var(--border); padding-top:6px; }
  .bar-chart .bar{ flex:1; background:var(--danger-strong); border-radius:3px 3px 0 0; min-height:2px; position:relative; cursor:pointer; }
  .bar-chart .bar.income{ background:var(--success); }
  .bar-chart .bar.selected{ outline:2px solid var(--primary); outline-offset:1px; }
  .trend-toggle{ display:flex; gap:6px; margin-bottom:10px; }
  .trend-gran-btn{ padding:5px 14px; font-size:12px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text-sub); cursor:pointer; }
  .trend-gran-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .trend-chart-wrap{ display:flex; gap:8px; }
  .trend-yaxis{ flex:0 0 auto; display:flex; flex-direction:column; justify-content:space-between; height:100px; padding-top:6px; font-size:10px; color:var(--text-sub); text-align:right; white-space:nowrap; }
  .trend-chart-inner{ flex:1; min-width:0; }
  .trend-xaxis{ display:flex; gap:4px; margin-top:4px; }
  .trend-xaxis span{ flex:1; font-size:9px; color:var(--text-sub); text-align:center; white-space:nowrap; overflow:hidden; }
  .no-data{ color:var(--text-sub); font-size:13px; text-align:center; padding:30px 0; }

  /* ---- Edit screen ---- */
  .section-label{ font-size:12px; color:var(--text-sub); margin:18px 0 8px; }
  .section-label:first-child{ margin-top:0; }
  .list-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .list-row .l{ display:flex; align-items:center; gap:8px; flex:1; }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .icon-btn{ background:none; border:none; color:var(--text-sub); cursor:pointer; padding:4px; }
  .add-btn{ width:100%; margin-top:10px; padding:10px 0; background:var(--accent-bg); border:1px dashed var(--primary); border-radius:var(--radius-sm); color:var(--primary); font-size:13px; cursor:pointer; }
  .cat-row{ cursor:grab; }
  .cat-row.dragging{ opacity:.4; }
  .heading-block.dragging, .shop-item.dragging{ opacity:.4; }
  .continue-btn{ width:100%; margin-top:14px; padding:12px 0; background:var(--accent-bg); border:1px solid var(--primary); border-radius:var(--radius-sm); color:var(--primary); font-weight:600; font-size:14px; cursor:pointer; }

  /* ---- サブ画面共通 ---- */
  .back-header{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .back-header button{ background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:2px 6px 2px 0; }
  .back-header h2{ margin:0; font-size:18px; font-weight:700; }

  /* ---- 予算 ---- */
  .budget-row{ margin-bottom:12px; }
  .budget-row .bh{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .budget-track{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .budget-fill{ height:100%; border-radius:4px; }

  /* ---- 立て替え ---- */
  .adv-filter{ display:flex; gap:8px; margin-bottom:12px; }
  .adv-filter select{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:13px; color:var(--text); }
  .adv-card{ padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .adv-card .t1{ display:flex; justify-content:space-between; font-size:14px; }
  .adv-card .t2{ display:flex; justify-content:space-between; align-items:center; margin-top:3px; font-size:12px; color:var(--text-sub); }
  .status-pill{ font-size:10px; padding:3px 9px; border-radius:20px; }
  .status-pill.unsettled{ background:var(--danger-bg); color:var(--danger); }
  .status-pill.settled{ background:var(--success-bg); color:var(--success); }
  .receipt-thumb{ width:36px; height:36px; object-fit:cover; border-radius:6px; margin-left:8px; }
  .link-btn{ background:none; border:none; color:var(--primary); font-size:12px; text-decoration:underline; cursor:pointer; padding:0; }

  /* ---- 買い物リスト ---- */
  .heading-block{ margin-bottom:18px; }
  .heading-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border-strong,var(--border)); cursor:grab; }
  .heading-items{ min-height:4px; }
  .add-item-row{ display:flex; gap:8px; margin-top:8px; align-items:flex-end; }
  .add-item-row textarea{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); font-size:13px; resize:vertical; min-height:44px; font-family:inherit; }
  .add-item-row button{ padding:10px 14px; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); font-size:13px; }
  .shop-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .shop-item input[type=checkbox]{ width:19px; height:19px; accent-color:var(--primary); }
  .shop-item.done{ opacity:0.6; }
  .shop-item.done span.iname{ text-decoration:line-through; color:var(--text-sub); }

  /* ---- Form modal (used for goal/fixedcost/category edit) ---- */
  .form-field{ margin-bottom:12px; }
  .form-field label{ display:block; font-size:12px; color:var(--text-sub); margin-bottom:4px; }
  .form-field input, .form-field select{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .form-actions{ display:flex; gap:8px; margin-top:14px; }
  .form-actions button{ flex:1; padding:10px 0; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; }
  .form-actions .save{ background:var(--primary); color:#fff; border:none; font-weight:600; }
  .form-actions .cancel{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .form-actions .delete{ background:var(--danger-bg); border:1px solid var(--danger-strong); color:var(--danger); }
  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-swatches .cs{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-swatches .cs.sel{ border-color:var(--text); }
</style>
</head>
<body>

<div id="app">

  <!-- ===== Loading (auto-login確認中) ===== -->
  <div id="loadingScreen"><div class="spin"></div></div>

  <!-- ===== Auth screen ===== -->
  <div id="authScreen">
    <h1>家計簿</h1>
    <p class="sub" id="authSub">ログインして始めましょう</p>
    <div class="field"><label>メールアドレス</label><input type="email" id="authEmail" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input type="password" id="authPass" autocomplete="current-password"></div>
    <button class="btn-primary" id="authSubmit">ログイン</button>
    <div id="authError"></div>
    <div id="authToggle">アカウントをお持ちでない方はこちら(新規登録)</div>
  </div>

  <!-- ===== Main shell ===== -->
  <div id="shell">
    <div id="screenArea"></div>

    <div id="tabbar">
      <button class="tab-btn" data-screen="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>ホーム</span></button>
      <button class="tab-btn" data-screen="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>入力</span></button>
      <button class="tab-btn" data-screen="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg><span>集計</span></button>
      <button class="tab-btn" data-screen="shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l1.5 6M18 2l-1.5 6M3.5 8h17l-1.6 10.3a2 2 0 01-2 1.7H7.1a2 2 0 01-2-1.7L3.5 8z"/></svg><span>買い物</span></button>
      <button class="tab-btn" data-screen="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>編集</span></button>
    </div>
  </div>
</div>

<div id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {

  errEl.textContent = '';

function periodKeyFor(year, month){ // month: 0-indexed, normalizes rollover
  const d = new Date(year, month, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function resolvePeriodStart(year, month, day){
  const key = periodKeyFor(year, month);
  const override = state.periodOverrides && state.periodOverrides[key];
  if(override){
    const [oy,om,od] = override.split('-').map(Number);
    return { date: new Date(oy, om-1, od), key, overridden:true };
  }
  const d = new Date(year, month, 1);
  return { date: new Date(d.getFullYear(), d.getMonth(), day), key, overridden:false };
}
function getPeriodForDate(refDate){
  const s = Math.min(28, Math.max(1, state.monthStartDay||1));
  let baseYear = refDate.getFullYear(), baseMonth = refDate.getMonth();
  if(refDate.getDate() < s) baseMonth -= 1;
  const mk = bm => {
    const startInfo = resolvePeriodStart(baseYear, bm, s);
    const endInfo = resolvePeriodStart(baseYear, bm+1, s);
    return { start: toLocalStr(startInfo.date), end: toLocalStr(endInfo.date), startDate: startInfo.date, endDate: endInfo.date, key: startInfo.key, overridden: startInfo.overridden, defaultDay: s };
  };
  for(const off of [0,-1,1]){
    const p = mk(baseMonth+off);
    if(refDate>=p.startDate && refDate<p.endDate) return p;
  }
  return mk(baseMonth);
}
function getCurrentPeriod(){ return getPeriodForDate(new Date()); }
function getNextPeriodInfo(period){
  const s = period.defaultDay;
  const [ky,km] = period.key.split('-').map(Number); // ky-km = this period's base year-month (km is 1-indexed)
  const startInfo = resolvePeriodStart(ky, km, s); // km is already "next month" in 0-indexed terms
  const endInfo = resolvePeriodStart(ky, km+1, s);
  return { start: toLocalStr(startInfo.date), end: toLocalStr(endInfo.date), startDate: startInfo.date, endDate: endInfo.date, key: startInfo.key, overridden: startInfo.overridden, defaultDay: s };
}
function contribAmt(v){ return v==null ? 0 : (typeof v==='object' ? (v.amount||0) : v); }
function contribAccountId(v){ return (v!=null && typeof v==='object') ? (v.accountId||'') : ''; }
function sumContrib(g){ return Object.values(g.contributions||{}).reduce((s,v)=>s+contribAmt(v),0); }
function goalCumulative(g){ return g.monthlyTarget>0 ? sumContrib(g) : (g.allocatedAmount||0); }
function accountBalance(accountId){
  const acc = state.accounts.find(a=>a.id===accountId);
  const init = acc ? (acc.initialBalance||0) : 0;
  const txSum = state.transactions.filter(t=>t.accountId===accountId).reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount), 0);
  const transferIn = state.transfers.filter(tr=>tr.toAccountId===accountId).reduce((s,tr)=>s+tr.amount,0);
  const transferOut = state.transfers.filter(tr=>tr.fromAccountId===accountId).reduce((s,tr)=>s+tr.amount,0);
  const advOut = state.advances.filter(a=>a.accountId===accountId).reduce((s,a)=>s+a.amount,0);
  const advBack = state.advances.filter(a=>a.settled && advReturnAccount(a)===accountId).reduce((s,a)=>s+a.amount,0);
  return init + txSum + transferIn - transferOut - advOut + advBack;
}
function advReturnAccount(a){ return a.settleAccountId || a.accountId || ''; }
function accountOptionsHtml(selectedId, includeEmpty){
  return (includeEmpty?`<option value="">未設定</option>`:'') + state.accounts.map(a=>`<option value="${a.id}" ${selectedId===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('');
}
function savingsAccount(){
  return state.accounts.find(a=>a.name==='口座1') || state.accounts[0] || null;
}
function goalAccount(g){
  return state.accounts.find(a=>a.id===g.accountId) || savingsAccount();
}
function accountNameOrUnset(accountId){
  const a = state.accounts.find(x=>x.id===accountId);
  return a ? a.name : '未設定';
}
function renderHome(){
  const period = getCurrentPeriod();
  const thisMonth = state.transactions.filter(t=> t.date>=period.start && t.date<period.end);
  const monthBalance = thisMonth.reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount), 0);
  const monthIncome = thisMonth.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const monthExpense = thisMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const accountBalances = state.accounts.map(a=>({ id:a.id, name:a.name, balance: accountBalance(a.id) }));
  const allBalance = accountBalances.reduce((s,a)=>s+a.balance, 0);
  const allocatedTotal = state.goals.reduce((s,g)=>s+goalCumulative(g),0);
  const savAcc = savingsAccount();
  const unsettledAll = state.advances.filter(a=>!a.settled).reduce((s,a)=>s+a.amount,0);

  state.goals.forEach(g=>{ const ga = goalAccount(g); if(ga) goalsByAcc[ga.id] = (goalsByAcc[ga.id]||0) + goalCumulative(g); });
  const accStatus = {};
  const accNotices = [];
  accountBalances.forEach(a=>{
    const need = goalsByAcc[a.id]||0;
    let level = '';
    if(need>0 && a.balance < need){
      const isSav = savAcc && a.id===savAcc.id;
      const adv = isSav ? unsettledAll : 0;
      const msg = `${a.name} 貯蓄過不足 ${yen(a.balance-need)}(立替未精算${yen(adv)}) 清算後 ${yen(a.balance+adv)}`;
      if(adv>0 && a.balance + adv >= need){ level = 'orange'; }
      else { level = 'red'; }
      accNotices.push({ level, text: msg });
    }
    accStatus[a.id] = level;
  });

  const today = new Date();
  const startDay = Math.min(28, Math.max(1, state.monthStartDay||1));
  const distFromStart = day => (day - startDay + 31) % 31;
  const fixedSorted = state.fixedCosts.slice().sort((a,b)=>distFromStart(a.day)-distFromStart(b.day));

  const budgetRows = computeBudgetRows();
  const reservedSavings = state.goals.reduce((sum,g)=>{
    if(!(g.monthlyTarget>0)) return sum;
    const actualRaw = g.contributions ? g.contributions[period.start] : undefined;
    return sum + (actualRaw!=null ? contribAmt(actualRaw) : g.monthlyTarget);
  }, 0);
  const fixedCostsTotal = state.fixedCosts.reduce((s,f)=>s+f.amount,0);
  const budgetTotal = state.budgets.reduce((s,b)=>s+b.amount,0);

  const spentBudgetTotal = budgetRows.reduce((s,r)=>s+r.spent,0);
  const extraExpense = monthExpense - fixedCatExpense - spentBudgetTotal;
  const unsettledAdv = state.advances.filter(a=>!a.settled);
  const advOutAll = unsettledAdv.filter(a=>a.accountId).reduce((s,a)=>s+a.amount,0);
  const advOutPeriod = unsettledAdv.filter(a=>a.accountId && a.date>=period.start && a.date<period.end).reduce((s,a)=>s+a.amount,0);
  const usableNow = monthIncome - fixedCostsTotal - budgetTotal - reservedSavings - extraExpense - advOutPeriod;
  const carryover = allBalance + monthExpense - fixedCostsTotal - budgetTotal - reservedSavings - extraExpense;
  const advTotal = unsettledAdv.reduce((s,a)=>s+a.amount,0);

      </div>
      ${accNotices.length ? `<div style="margin-top:10px;font-size:11px;line-height:1.6;">${accNotices.map(n=>`<div style="color:${n.level==='red'?'var(--danger)':'#E8A33D'};">${n.level==='red'?'⚠ ':'・'}${escapeHtml(n.text)}</div>`).join('')}</div>` : ''}` : ''}

function parseDateStr(str){ const [y,m,d] = str.split('-').map(Number); return new Date(y,m-1,d); }
function shiftDateStr(str, n){ const [y,m,d] = str.split('-').map(Number); return toLocalStr(new Date(y,m-1,d+n)); }
function periodByOffset(k){
  const cur = getCurrentPeriod();
  const sd = cur.defaultDay;
  const [ky,km] = cur.key.split('-').map(Number);
  const st = resolvePeriodStart(ky, km-1+k, sd);
  const en = resolvePeriodStart(ky, km+k, sd);
  const endInc = new Date(en.date); endInc.setDate(endInc.getDate()-1);
  return { start: toLocalStr(st.date), end: toLocalStr(endInc) };
}
function ensureSumRange(){
  if(!state.sumRangeManual){
    state.sumRange = periodByOffset(state.sumOffset||0);
  }
}
function renderCalendar(){

  const {start,end} = state.sumRange;

    .concat(state.categories.map(c=>`<option value="${c.id}" ${state.calFilter.category===c.id?'selected':''}>${escapeHtml(c.name)}</option>`)).join('');

  const dayTotals = {}, dayIncome = {};
  state.transactions.forEach(t=>{
    if(state.calFilter.category!=='all' && t.category!==state.calFilter.category) return;
    if(t.date<start || t.date>end) return;
    if(t.type==='expense') dayTotals[t.date] = (dayTotals[t.date]||0) + t.amount;
    else dayIncome[t.date] = (dayIncome[t.date]||0) + t.amount;
  });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  let n = 0;
  for(let d=new Date(startD); d<=endD && n<400; d.setDate(d.getDate()+1), n++){
    const dateStr = toLocalStr(d);

    const inc = dayIncome[dateStr]||0;
    let bg = 'transparent';
    if(amt>=10000) bg = 'var(--danger-strong)';

    const dayLabel = (d.getDate()===1 || n===0) ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getDate()}`;
    cells += `<div class="cal-cell cal-day" data-date="${dateStr}" style="background:${bg}">
      <div>${dayLabel}</div>
      ${amt>0?`<span class="amt">${amt>=10000?'-'+Math.round(amt/1000)+'k':'-'+amt.toLocaleString()}</span>`:''}
      ${inc>0?`<span class="amt" style="color:var(--success)">+${inc>=10000?Math.round(inc/1000)+'k':inc.toLocaleString()}</span>`:''}
    </div>`;
  }
  const isDefault = !state.sumRangeManual && (state.sumOffset||0)===0;

  return `

      <button id="rangeBtn"><span>${start.replace(/-/g,'/')} 〜 ${end.replace(/-/g,'/')}</span><span>📅</span></button>
      <button id="calNext" style="${state.sumRangeManual?'visibility:hidden;':''}">›</button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text-sub);margin:-6px 0 8px;">${(()=>{ if(state.sumRangeManual) return '指定した期間'; const o=state.sumOffset||0; return o===0?'今期':o===-1?'前期':o===-2?'前々期':o===1?'来期':(o<0?(-o)+'期前':o+'期先'); })()}</div>
    ${isDefault ? '' : '<div style="text-align:center;margin:-4px 0 10px;"><button class="link-btn" id="calReset">今期(起算日の期間)に戻す</button></div>'}
    <div class="cal-grid">

/* ---------- 集計 ---------- */

function advSettleDate(a){
  if(a.settledDate) return a.settledDate;
  const p = getPeriodForDate(parseDateStr(a.date));
  return shiftDateStr(p.end, -1);
}
function totalBalanceBefore(dateStr){
  let sum = 0;
  state.accounts.forEach(acc=>{
    const id = acc.id;
    const init = acc.initialBalance||0;
    const tx = state.transactions.filter(t=>t.accountId===id && t.date<dateStr).reduce((x,t)=>x+(t.type==='income'?t.amount:-t.amount),0);
    const out = state.advances.filter(a=>a.accountId===id && a.date<dateStr).reduce((x,a)=>x+a.amount,0);
    const back = state.advances.filter(a=>a.settled && advReturnAccount(a)===id && advSettleDate(a)<dateStr).reduce((x,a)=>x+a.amount,0);
    sum += init + tx - out + back;
  });
  return sum;
}
function periodResult(p, endClamp){
  const fixedCat = state.categories.find(c=>c.type==='expense' && c.name==='固定費');
  const fixedCatId = fixedCat ? fixedCat.id : null;
  const E = endClamp && endClamp<p.end ? endClamp : p.end;
  const inR = t => t.date>=p.start && t.date<=E;
  const tx = state.transactions.filter(inR);
  const exp = tx.filter(t=>t.type==='expense');
  const isFixed = t => t.fixedCostId || t.category===fixedCatId;
  const income = tx.filter(t=>t.type==='income').reduce((x,t)=>x+t.amount,0);
  const fixed = exp.filter(isFixed).reduce((x,t)=>x+t.amount,0);
  const free = exp.filter(t=>!isFixed(t)).reduce((x,t)=>x+t.amount,0);
  const budCats = new Set(state.budgets.map(b=>b.categoryId));
  const budget = exp.filter(t=>!isFixed(t) && budCats.has(t.category)).reduce((x,t)=>x+t.amount,0);
  const savings = state.goals.reduce((x,g)=> x + Object.entries(g.contributions||{}).filter(([k])=>k>=p.start && k<=p.end).reduce((y,[,v])=>y+contribAmt(v),0), 0);
  const open = totalBalanceBefore(p.start);
  const close = totalBalanceBefore(shiftDateStr(E,1));
  // 使えるお金(ホームと同じ計算)
  const fixedCostsTotal = state.fixedCosts.reduce((x,f)=>x+f.amount,0);
  const budgetTotal = state.budgets.reduce((x,b)=>x+b.amount,0);
  const reserved = state.goals.reduce((sum,g)=>{
    if(!(g.monthlyTarget>0)) return sum;
    const raw = g.contributions ? g.contributions[p.start] : undefined;
    return sum + (raw!=null ? contribAmt(raw) : g.monthlyTarget);
  },0);
  const allExp = exp.reduce((x,t)=>x+t.amount,0);
  const fixedCatExp = exp.filter(t=>t.category===fixedCatId).reduce((x,t)=>x+t.amount,0);
  const spentBud = exp.filter(t=>budCats.has(t.category)).reduce((x,t)=>x+t.amount,0);
  const extra = allExp - fixedCatExp - spentBud;
  const advOut = state.advances.filter(a=>!a.settled && a.accountId && a.date>=p.start && a.date<=E).reduce((x,a)=>x+a.amount,0);
  const usable = income - fixedCostsTotal - budgetTotal - reserved - extra - advOut;
  return { income, free, fixed, savings, budget, open, close, usable };
}
function renderAnalysis(){

  if(state.sumRangeManual){
    return `<div class="card-label">前期との比較</div><div class="card" style="margin-bottom:14px;"><div class="an-sub">期間を自分で指定しているため、前期との比較は出ません。「今期に戻す」を押すと表示されます。</div></div>`;
  }
  const off = state.sumOffset||0;
  const todayS = toLocalStr(new Date());
  const selP = periodByOffset(off), prevP = periodByOffset(off-1);
  if(todayS < selP.start){
    return `<div class="card-label">前期との比較</div><div class="card" style="margin-bottom:14px;"><div class="an-sub">この期はまだ始まっていません。</div></div>`;
  }
  const isNow = todayS <= selP.end;

  return `

      <div class="an-sub">左は前の期の最終結果(固定)、右は${isNow?'今日までの累計':'その期の最終結果'}です。差は、右から左を引いた金額です。プラスはオレンジ(前より多い)、マイナスは緑(前より少ない)です。</div>
      <div style="display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:4px;font-size:11px;color:var(--text-sub);padding-bottom:4px;">
        <div></div>
        <div style="text-align:right;">前の期<br>${f(prevP.start)}〜${f(prevP.end)}</div>
        <div style="text-align:right;">${isNow?'今期':'この期'}<br>${f(selP.start)}〜${f(isNow?todayS:selP.end)}</div>
        <div style="text-align:right;">差(%)</div>
      </div>
      ${row('期の初めの繰越', cur.open, prv.open, false)}
      ${row('収入', cur.income, prv.income, true)}
      ${row('支出(固定費を除く)', cur.free, prv.free, true)}
      ${row('固定費', cur.fixed, prv.fixed, true)}
      ${row('貯蓄', cur.savings, prv.savings, true)}
      ${row('予算', cur.budget, prv.budget, true)}
      ${row(isNow?'いまの残高':'期の終わりの残高', cur.close, prv.close, false)}
      ${row('使えるお金', cur.usable, prv.usable, false)}
      <div class="an-sub" style="margin-top:8px;">・%は、前の期を100としたときの割合です。<br>・「予算」は、予算を決めたカテゴリで使った金額です(支出に含まれます)。<br>・「使えるお金」は、いまの固定費・予算の設定額で計算しています。<br>・過去に精算した立替は、立て替えた期の中で戻ったものとして、残高を計算しています。</div>
    </div>`;
}
function renderSummary(){
  ensureSumRange();
  const {start,end} = state.sumRange;
  const inRange = t => t.date>=start && t.date<=end;
  const expenses = state.transactions.filter(t=>t.type==='expense' && inRange(t));
  const incomes = state.transactions.filter(t=>t.type==='income' && inRange(t));
  const incomeTotal = incomes.reduce((s,t)=>s+t.amount,0);
  const totalsByCat = {};
  expenses.forEach(t=>{ totalsByCat[t.category] = (totalsByCat[t.category]||0)+t.amount; });
  const catEntries = Object.entries(totalsByCat).map(([id,amt])=>{
    const c = state.categories.find(c=>c.id===id);
    return { name: c?c.name:'不明', color: c?c.color:'#999', amt };
  });
  catEntries.sort((a,b)=>b.amt-a.amt);
  const total = catEntries.reduce((s,c)=>s+c.amt,0);
  const catMax = catEntries.length ? catEntries[0].amt : 0;

  let gradient = '', acc = 0;
  catEntries.forEach(c=>{
    const pct = total>0 ? c.amt/total*100 : 0;
    gradient += `${c.color} ${acc}% ${acc+pct}%, `;
    acc += pct;
  });
  gradient = gradient.slice(0,-2) || 'var(--surface-2) 0% 100%';

  // 収支推移(日/週/月それぞれ既定の期間で集計。期間は手動設定も可能)
  const gran = state.trendGranularity || 'day';
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  let autoTrendStart, autoTrendEnd;
  {
    const e = new Date(todayD);
    let s;
    if(gran==='day'){ s = new Date(e); s.setDate(s.getDate()-6); }
    else if(gran==='week'){ s = new Date(getCurrentPeriod().startDate); }
    else { s = new Date(e.getFullYear(), e.getMonth()-11, 1); }
    autoTrendStart = toLocalStr(s); autoTrendEnd = toLocalStr(e);
    if(gran==='week'){ const pe = new Date(getCurrentPeriod().endDate); pe.setDate(pe.getDate()-1); autoTrendEnd = toLocalStr(pe); }
  }
  let trendStart, trendEnd;
  if(state.trendRangeManual && state.trendRange){
    trendStart = state.trendRange.start; trendEnd = state.trendRange.end;
  } else {
    trendStart = autoTrendStart; trendEnd = autoTrendEnd;
  }
  const trendDays = [];
  const [tsy,tsm,tsd] = trendStart.split('-').map(Number), [tey,tem,ted] = trendEnd.split('-').map(Number);
  let td0 = new Date(tsy,tsm-1,tsd), td1 = new Date(tey,tem-1,ted);
  for(let d=new Date(td0); d<=td1; d.setDate(d.getDate()+1)) trendDays.push(toLocalStr(d));
  const netByDay = {}, expByDay = {};
  trendDays.forEach(day=>{
    const exp = state.transactions.filter(t=>t.type==='expense'&&t.date===day).reduce((s,t)=>s+t.amount,0);
    const inc = state.transactions.filter(t=>t.type==='income'&&t.date===day).reduce((s,t)=>s+t.amount,0);
    netByDay[day] = inc - exp;
    expByDay[day] = exp;
  });
  const expenseOnly = !!state.trendExpenseOnly;
  const valByDay = expenseOnly ? expByDay : netByDay;
  let buckets = [];
  const dowNames = ['日','月','火','水','木','金','土'];
  if(gran==='day'){
    buckets = trendDays.map(day=>{
      const [,mo,da] = day.split('-');
      const dow = new Date(day+'T00:00:00').getDay();
      return { label: `${parseInt(mo)}/${parseInt(da)}(${dowNames[dow]})`, value: valByDay[day], dow, from:day, to:day };
    });
  } else if(gran==='week'){
    const weekChunks = [];
    trendDays.forEach((day,i)=>{
      const isMonday = new Date(day+'T00:00:00').getDay()===1;
      if(i===0 || isMonday) weekChunks.push([]);
      weekChunks[weekChunks.length-1].push(day);
    });
    for(const chunk of weekChunks){
      const [,mo,da] = chunk[0].split('-');
      const value = chunk.reduce((s,day)=>s+valByDay[day],0);
      buckets.push({ label: `${parseInt(mo)}/${parseInt(da)}〜`, value, from:chunk[0], to:chunk[chunk.length-1] });
    }
  } else { // month
    const byMonth = {}, monthFrom = {}, monthTo = {};
    trendDays.forEach(day=>{
      const key = day.slice(0,7);
      byMonth[key] = (byMonth[key]||0) + valByDay[day];
      if(!monthFrom[key]) monthFrom[key] = day;
      monthTo[key] = day;
    });
    buckets = Object.entries(byMonth).map(([key,value])=>{
      const [,mo] = key.split('-');
      return { label: `${parseInt(mo)}月`, value, from:monthFrom[key], to:monthTo[key] };
    });
  }
  const dayVals = buckets.map(b=>b.value);
  const maxVal = Math.max(1, ...dayVals.map(v=>Math.abs(v)));
  const labelEvery = 1;

  let trendDetailHtml = '';
  if(state.trendSelectedIdx!=null && buckets[state.trendSelectedIdx]){
    const b = buckets[state.trendSelectedIdx];
    const recs = state.transactions
      .filter(t=> t.date>=b.from && t.date<=b.to && (!expenseOnly || t.type==='expense'))
      .sort((x,y)=> y.date.localeCompare(x.date) || ((y.createdAt||0)-(x.createdAt||0)));
    const fmtMD = d=>{ const [,mo,da] = d.split('-').map(Number); return `${mo}/${da}`; };
    const title = b.from===b.to ? fmtMD(b.from) : `${fmtMD(b.from)}〜${fmtMD(b.to)}`;
    trendDetailHtml = `
      <div class="card" style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
          <span class="card-label" style="margin-bottom:0;">${title}の内訳</span>
          <span style="font-size:13px;font-weight:600;">${expenseOnly?'支出 ':'収支 '}${b.value>=0&&!expenseOnly?'+':''}${yen(b.value)}</span>
        </div>
        ${recs.length ? recs.map(t=>{
          const cat = state.categories.find(c=>c.id===t.category);
          return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);">
            <span style="flex:0 0 40px;font-size:11px;color:var(--text-sub);">${fmtMD(t.date)}</span>
            <div style="flex:1;min-width:0;"><div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(cat?cat.name:'不明')}${t.memo?'・'+escapeHtml(t.memo):''}</div><div style="font-size:11px;color:var(--text-sub);">${escapeHtml(accountNameOrUnset(t.accountId))}</div></div>
            <span style="flex:0 0 auto;font-size:13px;font-weight:600;color:${t.type==='income'?'var(--success)':'var(--danger)'};">${t.type==='income'?'+':'-'}${yen(t.amount)}</span>

function renderRangeCalendar(){
  ensureSumRange();
  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const {start,end} = state.sumRange;
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const inRange = dateStr>=start && dateStr<=end;
    cells += `<div class="cal-cell rangeday" data-date="${dateStr}" style="background:${inRange?'var(--accent-bg)':'transparent'}"><div>${day}</div></div>`;
  }
  return `
    <div class="cal-header">
      <button id="rcPrev">‹</button><span class="ym">${y}年${m+1}月(開始日→終了日の順にタップ)</span><button id="rcNext">›</button>
    </div>
    <div class="cal-grid">${['月','火','水','木','金','土','日'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  `;
}

function computeBudgetRows(){
  const period = getCurrentPeriod();
  return state.budgets.map(b=>{
    const cat = state.categories.find(c=>c.id===b.categoryId);
    const spent = state.transactions.filter(t=>t.type==='expense' && t.category===b.categoryId && t.date>=period.start && t.date<period.end).reduce((s,t)=>s+t.amount,0);
    const pct = b.amount>0 ? spent/b.amount*100 : 0;
    let color = 'var(--primary)';
    if(pct>=100) color = 'var(--danger)';
    else if(pct>=80) color = '#FFD23F';
    return { id:b.id, name: cat?cat.name:'不明なカテゴリ', amount:b.amount, spent, pct, color };
  });
}

    records.push({ id:t.id, kind:'transaction', type:t.type, date:t.date, createdAt:t.createdAt||0, label: cat?cat.name:'不明', categoryId:t.category, memo:t.memo, amount:t.amount, accountIds:[t.accountId||''], accName: accountNameOrUnset(t.accountId) });

      records.push({ id:a.id, kind:'advance', type:'advance', date:a.date, createdAt:a.createdAt||0, label:'立替・'+a.person, memo:a.memo, amount:a.amount, settled:a.settled, accountIds:[a.accountId||''], accName: accountNameOrUnset(a.accountId) });
    });

    </div>
    ${state.listAccOpen ? `

      ${state.accounts.map(a=>`
        <label class="cat-select-opt"><input type="checkbox" class="fAccOpt" value="${a.id}" ${f.accounts.includes(a.id)?'checked':''}>${escapeHtml(a.name)}</label>

function catRow(c){
  return `<div class="list-row cat-row" draggable="true" data-id="${c.id}">

    <span class="icon-btn cat-edit" data-id="${c.id}">✎</span>
  </div>`;
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function findFixedCostTransaction(f, period){
  const byId = state.transactions.find(t=>t.type==='expense' && t.fixedCostId===f.id && t.date>=period.start && t.date<period.end);
  if(byId) return byId;
  return state.transactions.find(t=>t.type==='expense' && !t.fixedCostId && t.memo===f.name && t.date>=period.start && t.date<period.end);
}
function isFixedCostLogged(f, period){
  return !!findFixedCostTransaction(f, period);
}
async function getFixedCostCategoryId(){
  const existing = state.categories.find(c=>c.type==='expense' && c.name==='固定費');
  if(existing) return existing.id;
  const order = state.categories.filter(c=>c.type==='expense').length;
  const ref = await addDoc(collection(db,'users',state.uid,'categories'), { name:'固定費', type:'expense', color:'#8A8FA3', order });
  return ref.id;
}

/* ====== イベント付与 ====== */
function attachScreenEvents(){
  if(state.screen==='home'){
    const advCard = document.getElementById('advSummaryCard');
    if(advCard) advCard.onclick = ()=>{ state.screen='advances'; render(); };
    const transferBtn = document.getElementById('openTransferBtn');
    if(transferBtn) transferBtn.onclick = ()=> openTransferForm();
    document.querySelectorAll('.fixed-check').forEach(cb=>{
      cb.onchange = async ()=>{
        const f = state.fixedCosts.find(x=>x.id===cb.dataset.id);
        if(!f) return;
        const period = getCurrentPeriod();
        if(cb.checked){
          const cat = await getFixedCostCategoryId();
          await addDoc(collection(db,'users',state.uid,'transactions'), { type:'expense', category:cat, amount:f.amount, date:todayStr(), memo:f.name, accountId:f.accountId||'', fixedCostId:f.id, createdAt:Date.now() });
        } else {
          const t = findFixedCostTransaction(f, period);
          if(t) await deleteDoc(doc(db,'users',state.uid,'transactions',t.id));

function openSumRangeForm(){
  ensureSumRange();
  const box = document.getElementById('modalBox');
  const cur = state.sumRange;
  const now = new Date();
  const monthStart = toLocalStr(new Date(now.getFullYear(), now.getMonth(), 1));
  const monthEnd = toLocalStr(new Date(now.getFullYear(), now.getMonth()+1, 0));
  const fmt = r => `${r.start.replace(/-/g,'/')} 〜 ${r.end.replace(/-/g,'/')}`;
  const quick = [
    ['今期', periodByOffset(0), ()=>{ state.sumRangeManual=false; state.sumOffset=0; }],
    ['前期', periodByOffset(-1), ()=>{ state.sumRangeManual=false; state.sumOffset=-1; }],
    ['前々期', periodByOffset(-2), ()=>{ state.sumRangeManual=false; state.sumOffset=-2; }],
    ['今月(1日〜月末)', {start:monthStart,end:monthEnd}, ()=>{ state.sumRangeManual=true; state.sumRange={start:monthStart,end:monthEnd}; }]
  ];
  box.innerHTML = `
    <div class="mh"><span>集計する期間を選ぶ</span><button id="mClose">✕</button></div>
    <div style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">よく使う期間</div>
    ${quick.map((q,i)=>`<button class="list-row" data-q="${i}" style="width:100%;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--border,#333);color:var(--text);text-align:left;"><span>${q[0]}</span><span style="color:var(--text-sub);font-size:12px;">${fmt(q[1])}</span></button>`).join('')}
    <div style="font-size:12px;color:var(--text-sub);margin:14px 0 6px;">自分で期間を指定する</div>
    <div class="form-field"><label>開始日</label><input type="date" id="srStart" value="${cur.start}"></div>
    <div class="form-field"><label>終了日</label><input type="date" id="srEnd" value="${cur.end}"></div>
    <div id="srPreview" style="font-size:13px;font-weight:700;text-align:center;margin-bottom:6px;"></div>
    <div id="srErr" style="color:var(--danger);font-size:12px;min-height:16px;"></div>
    <div class="form-actions"><button class="cancel" id="fCancel">キャンセル</button><button class="save" id="fSave">この期間にする</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('fCancel').onclick = closeModal;
  box.querySelectorAll('[data-q]').forEach(b=>{
    b.onclick = ()=>{ quick[+b.dataset.q][2](); state.trendSelectedIdx = null; closeModal(); render(); };
  });
  const sEl = document.getElementById('srStart'), eEl = document.getElementById('srEnd');
  const pv = ()=>{
    const s_=sEl.value, e_=eEl.value, p=document.getElementById('srPreview');
    if(!s_||!e_||s_>e_){ p.textContent=''; return; }
    const days = Math.round((parseDateStr(e_)-parseDateStr(s_))/86400000)+1;
    p.textContent = `${s_.replace(/-/g,'/')} 〜 ${e_.replace(/-/g,'/')}(${days}日間)`;
  };
  sEl.oninput = pv; eEl.oninput = pv; pv();
  document.getElementById('fSave').onclick = ()=>{
    const s_=sEl.value, e_=eEl.value;
    if(!s_||!e_){ document.getElementById('srErr').textContent='開始日と終了日を入力してください'; return; }
    if(s_>e_){ document.getElementById('srErr').textContent='終了日は開始日より後の日にしてください'; return; }
    state.sumRangeManual = true; state.sumRange = { start:s_, end:e_ }; state.trendSelectedIdx = null;
    closeModal(); render();
  };
}
function attachRangeCalEvents(){
  const prev = document.getElementById('rcPrev'), next = document.getElementById('rcNext');
  if(prev) prev.onclick = ()=>{ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1); document.getElementById('rangeCalWrap').innerHTML = renderRangeCalendar(); attachRangeCalEvents(); };
  if(next) next.onclick = ()=>{ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1); document.getElementById('rangeCalWrap').innerHTML = renderRangeCalendar(); attachRangeCalEvents(); };
  document.querySelectorAll('.rangeday').forEach(cell=>{
    cell.onclick = ()=>{
      const date = cell.dataset.date;
      state.sumRangeManual = true;
      if(state.rangePicking==='start' || !state.rangePicking){
        state.sumRange = { start: date, end: date };
        state.rangePicking = 'end';
      }else{
        if(date < state.sumRange.start){ state.sumRange = {start:date, end:state.sumRange.start}; }
        else { state.sumRange.end = date; }
        state.rangePicking = 'start';
      }
      render();
      document.getElementById('rangeCalWrap').style.display='block';
    };
  });
}

function attachSwipeDelete(){
  document.querySelectorAll('.swipe-row').forEach(row=>{
    const inner = row.querySelector('.swipe-inner');
    const delBtn = row.querySelector('.swipe-del');
    let startX=0, curX=0, dragging=false;
    inner.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; }, {passive:true});
    inner.addEventListener('touchmove', e=>{
      if(!dragging) return;
      curX = e.touches[0].clientX - startX;
      if(curX<0) inner.style.transform = `translateX(${Math.max(curX,-70)}px)`;
    }, {passive:true});
    inner.addEventListener('touchend', ()=>{
      dragging=false;
      inner.style.transform = curX < -35 ? 'translateX(-70px)' : 'translateX(0)';
      curX=0;
    });
    delBtn.onclick = async ()=>{
      await deleteDoc(doc(db,'users',state.uid,'transactions',row.dataset.id));
      row.remove();
    };
  });
}

/* ---- 入力保存 ---- */
async function saveTransaction(keepGoing){
  const amt = parseAmt(document.getElementById('inAmt').value);
  const date = document.getElementById('inDate').value;
  const memo = document.getElementById('inMemo').value;
  const msg = document.getElementById('inMsg');
  if(!amt || amt<=0){ msg.textContent = '金額を正しく入力してください'; return; }
  if(!date){ msg.textContent = '日付を選択してください'; return; }

  const accountId = document.getElementById('inAccount').value;
  if(inputType==='advance'){
    let person = document.getElementById('inPersonSel').value;
    if(person==='__new__'){
      person = document.getElementById('inPersonNew').value.trim();
      if(!person){ msg.textContent = '相手の名前を入力してください'; return; }
      if(!state.advanceContacts.some(c=>c.name===person)){
        await addDoc(collection(db,'users',state.uid,'advanceContacts'), { name: person });
      }
    }
    if(!accountId){ msg.textContent = '口座を選択してください'; return; }
    await addDoc(collection(db,'users',state.uid,'advances'), { person, amount:amt, date, memo, accountId, settled:false, receiptImg:null, createdAt:Date.now() });
  }else{
    const cat = document.getElementById('inCat').value;
    if(!cat){ msg.textContent = 'カテゴリを選択してください'; return; }
    if(!accountId){ msg.textContent = '口座を選択してください'; return; }
    await addDoc(collection(db,'users',state.uid,'transactions'), { type:inputType, category:cat, amount:amt, date, memo, accountId, createdAt:Date.now() });
  }

  if(keepGoing){
    document.getElementById('inAmt').value='';
    document.getElementById('inMemo').value='';
    msg.textContent = '保存しました。続けて入力できます';
  }else{
    state.screen='home'; render();
  }
}

function openPeriodForm(){
  const cur = getCurrentPeriod();
  const s0 = cur.defaultDay;
  const [ky,km] = cur.key.split('-').map(Number);
  const names = {'-4':'4期前','-3':'3期前','-2':'前々期','-1':'前期','0':'今期','1':'来期','2':'2期先'};
  const ks = [-4,-3,-2,-1,0,1,2];
  const rows = ks.map(k=>{
    const info = resolvePeriodStart(ky, km-1+k, s0);
    return { k, key: info.key, m0: km-1+k, start: toLocalStr(info.date), overridden: info.overridden };
  });
  const endOfLast = toLocalStr(resolvePeriodStart(ky, km-1+3, s0).date);
  const box = document.getElementById('modalBox');
  const rangeText = (i, startVal) => {
    const nextStart = i<rows.length-1 ? rows[i+1].start : endOfLast;
    return `${startVal.replace(/-/g,'/')} 〜 ${toLocalStr(new Date(parseDateStr(nextStart).getTime()-86400000)).replace(/-/g,'/')}`;
  };
  box.innerHTML = `
    <div class="mh"><span>起算日の設定</span><button id="mClose">✕</button></div>
    <div class="form-field"><label>毎月の基本の起算日(給料日など)</label>
      <select id="periodInput">${Array.from({length:28},(_,i)=>i+1).map(d=>`<option value="${d}" ${state.monthStartDay===d?'selected':''}>${d}日</option>`).join('')}</select>
    </div>
    <div style="font-size:11px;color:var(--text-sub);margin-bottom:12px;">ふだんは、この日から次の月の前日までが1つの期になります。例:25日なら「毎月25日〜翌月24日」です。</div>
    <div style="font-size:13px;font-weight:700;margin-bottom:4px;">期ごとの開始日</div>
    <div style="font-size:11px;color:var(--text-sub);margin-bottom:8px;">給料日が土日と重なるときなど、ずらしたい期だけ、開始日の日付を直してください。前の期の終わりは、自動で「開始日の前日」になります。過ぎた期も直せます。</div>
    ${rows.map((r,i)=>`
      <div class="form-field" style="margin-bottom:10px;">
        <label>${names[r.k]}${r.k===0?'(いまの期)':''}${r.overridden?'<span style="color:#E8A33D;font-size:11px;margin-left:6px;">ずらし済み</span>':''}</label>
        <input type="date" class="pStart" data-i="${i}" value="${r.start}">
        <div class="pRange" data-i="${i}" style="font-size:11px;color:var(--text-sub);margin-top:2px;">${rangeText(i,r.start)}</div>
      </div>`).join('')}
    <div id="pErr" style="color:var(--danger);font-size:12px;min-height:16px;"></div>
    <div class="form-actions"><button class="cancel" id="fCancel">キャンセル</button><button class="save" id="fSave">保存</button></div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('fCancel').onclick = closeModal;
  const inputs = [...box.querySelectorAll('.pStart')];
  const refresh = ()=>{
    const vals = inputs.map(x=>x.value);
    inputs.forEach((x,i)=>{
      const nextStart = i<inputs.length-1 ? vals[i+1] : endOfLast;
      const el = box.querySelector(`.pRange[data-i="${i}"]`);
      if(!vals[i] || !nextStart){ el.textContent=''; return; }
      const endD = toLocalStr(new Date(parseDateStr(nextStart).getTime()-86400000));
      el.textContent = `${vals[i].replace(/-/g,'/')} 〜 ${endD.replace(/-/g,'/')}`;
    });
  };
  inputs.forEach(x=>x.oninput = refresh);
  document.getElementById('fSave').onclick = async ()=>{
    const err = document.getElementById('pErr');
    const v = parseInt(document.getElementById('periodInput').value)||1;
    const vals = inputs.map(x=>x.value);
    if(vals.some(x=>!x)){ err.textContent='開始日が空の期があります'; return; }
    for(let i=1;i<vals.length;i++){
      if(vals[i] <= vals[i-1]){ err.textContent=`${names[rows[i].k]}の開始日は、${names[rows[i-1].k]}の開始日より後の日にしてください`; return; }
    }
    if(vals[vals.length-1] >= endOfLast){ err.textContent=`${names[rows[rows.length-1].k]}の開始日が、その次の期の開始日と重なっています`; return; }
    const overrides = {};
    rows.forEach((r,i)=>{
      const def = toLocalStr(new Date(ky, r.m0, v));
      const untouched = !r.overridden && vals[i]===r.start;
      overrides[r.key] = (!untouched && vals[i]!==def) ? vals[i] : deleteField();
    });
    await setDoc(doc(db,'users',state.uid,'meta','settings'), { monthStartDay: v, periodOverrides: overrides }, {merge:true});
    state.sumOffset = 0; state.sumRangeManual = false;
    closeModal();
  };
}

/* ---- カテゴリ並べ替え(ドラッグ&ドロップ) ---- */
function attachDragReorder(){
  ['expCatList','incCatList'].forEach(listId=>{
    const list = document.getElementById(listId);
    if(!list) return;
    let dragEl = null;
    list.querySelectorAll('.cat-row').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragEl = row; row.classList.add('dragging'); });
      row.addEventListener('dragend', async ()=>{
        row.classList.remove('dragging');
        const ids = [...list.querySelectorAll('.cat-row')].map(r=>r.dataset.id);
        await Promise.all(ids.map((id,idx)=> updateDoc(doc(db,'users',state.uid,'categories',id), {order:idx}) ));
      });
      row.addEventListener('dragover', e=>{
        e.preventDefault();
        const after = getDragAfterElement(list, e.clientY);
        if(!dragEl) return;
        if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl, after);
      });
    });
  });
}
function getDragAfterElement(container, y){
  const els = [...container.querySelectorAll('.cat-row:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element: child};
    else return closest;
  }, {offset: -Infinity}).element;
}

/* ====== 立て替えフォーム ====== */
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function copyAdvanceListText(){
  const f = state.advanceFilter;
  let list = state.advances.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(f.person!=='all') list = list.filter(a=>a.person===f.person);
  if(f.status!=='all') list = list.filter(a=>(f.status==='settled')===!!a.settled);
  const lines = list.map(a=>`${a.date}　${a.person}　${yen(a.amount)}${a.memo?'　'+a.memo:''}${a.settled?'　(精算済み)':''}`);
  const total = list.filter(a=>!a.settled).reduce((s,a)=>s+a.amount,0);
  const text = lines.join('\n') + `\n\n未精算合計: ${yen(total)}`;
  try{
    await navigator.clipboard.writeText(text);
    alert('コピーしました');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('コピーしました');
  }
}

function attachShoppingDrag(){
  const headingList = document.querySelectorAll('.heading-row');
  const container = headingList[0] ? headingList[0].closest('#screenArea') : null;
  let dragHeadingEl = null;
  headingList.forEach(row=>{
    row.addEventListener('dragstart', ()=>{ dragHeadingEl = row.closest('.heading-block'); dragHeadingEl.classList.add('dragging'); });
    row.addEventListener('dragend', async ()=>{
      dragHeadingEl.classList.remove('dragging');
      const ids = [...document.querySelectorAll('.heading-block')].map(el=>el.dataset.id);
      await Promise.all(ids.map((id,idx)=> updateDoc(doc(db,'users',state.uid,'shoppingHeadings',id), {order:idx}) ));
    });
  });
  if(container){
    container.addEventListener('dragover', e=>{
      if(!dragHeadingEl) return;
      const after = getBlockAfterElement(container, e.clientY);
      if(after==null) container.appendChild(dragHeadingEl); else container.insertBefore(dragHeadingEl, after);
    });
  }
  document.querySelectorAll('.heading-items').forEach(list=>{
    let dragItemEl = null;
    list.querySelectorAll('.shop-item[draggable="true"]').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragItemEl = row; row.classList.add('dragging'); });
      row.addEventListener('dragend', async ()=>{
        row.classList.remove('dragging');
        const ids = [...list.querySelectorAll('.shop-item')].map(r=>r.dataset.id);
        await Promise.all(ids.map((id,idx)=> updateDoc(doc(db,'users',state.uid,'shoppingItems',id), {order:idx}) ));
      });
      row.addEventListener('dragover', e=>{
        e.preventDefault(); e.stopPropagation();
        if(!dragItemEl) return;
        const after = getItemAfterElement(list, e.clientY);
        if(after==null) list.appendChild(dragItemEl); else list.insertBefore(dragItemEl, after);
      });
    });
  });
}
function getBlockAfterElement(container, y){
  const els = [...container.querySelectorAll('.heading-block:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element: child};
    else return closest;
  }, {offset: -Infinity}).element;
}
function getItemAfterElement(container, y){
  const els = [...container.querySelectorAll('.shop-item:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element: child};
    else return closest;
  }, {offset: -Infinity}).element;
}
