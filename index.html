<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<style>
  :root{
    --bg:#101214; --surface:#1B1F22; --surface-2:#262B2F;
    --text:#EDEFEF; --text-sub:#9AA1A6; --border:#2E3338;
    --primary:#2FA98C; --primary-dark:#22806B;
    --success:#3CB88F; --success-bg:#173029;
    --danger:#E0855F; --danger-bg:#3A241D; --danger-strong:#B9542E;
    --accent-bg:#1D2E2A;
    --radius:14px; --radius-sm:10px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  input, select, button{ font-family:inherit; font-size:15px; }
  input[type="date"]{ width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; }
  #app{ overflow-x:hidden; }
  #app{ max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---- Auth ---- */
  #authScreen{ display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:32px 24px; }
  #authScreen h1{ font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:.02em; }
  #authScreen p.sub{ color:var(--text-sub); margin:0 0 28px; font-size:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-sub); margin-bottom:5px; }
  .field input{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }
  .field input:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .btn-primary{ width:100%; padding:13px 0; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); font-weight:600; font-size:15px; cursor:pointer; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-secondary{ width:100%; padding:12px 0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; color:var(--text); cursor:pointer; }
  #authError{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }
  #authToggle{ text-align:center; margin-top:18px; font-size:13px; color:var(--primary); text-decoration:underline; cursor:pointer; }

  /* ---- Shell ---- */
  #shell{ display:none; flex-direction:column; flex:1; min-height:100vh; }
  #screenArea{ flex:1; overflow-y:auto; padding:18px 16px 90px; }
  h2.screen-title{ font-size:20px; font-weight:700; margin:0 0 16px; }
  #screenArea > h2.screen-title:not(:first-child){ margin-top:30px; padding-top:22px; border-top:1px solid var(--border); }

  /* ---- Tab bar ---- */
  #tabbar{ position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); max-width:480px; margin:0 auto; }
  .tab-btn{ flex:1; border:none; background:none; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-sub); cursor:pointer; min-width:0; }
  .tab-btn svg{ width:21px; height:21px; }
  .tab-btn span{ font-size:10px; white-space:nowrap; }
  .tab-btn.active{ color:var(--primary); }

  /* ---- Cards ---- */
  .card{ background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; border:1px solid var(--border); }
  .card-label{ font-size:12px; color:var(--text-sub); margin-bottom:6px; }
  .card-value{ font-size:20px; font-weight:700; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .progress-track{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .progress-fill{ height:100%; background:var(--success); border-radius:4px; }
  .fixed-item{ padding:9px 0; border-bottom:1px solid var(--border); }
  .fixed-item:last-child{ border-bottom:none; }
  .fixed-item .top{ display:flex; justify-content:space-between; font-size:14px; }
  .fixed-item .bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .fixed-item .bottom span:first-child{ font-size:12px; color:var(--text-sub); }
  .tag{ font-size:10px; background:var(--accent-bg); color:var(--primary); padding:3px 9px; border-radius:20px; }
  .days-left{ font-weight:600; font-size:13px; }
  .days-left.soon{ color:var(--danger); }

  /* ---- Calendar ---- */
  .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-header button{ background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:4px 10px; }
  .cal-header .ym{ font-size:16px; font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow{ font-size:11px; color:var(--text-sub); padding:4px 0; }
  .cal-cell{ border-radius:8px; padding:6px 0 4px; min-height:44px; cursor:pointer; font-size:13px; position:relative; }
  .cal-cell.empty{ cursor:default; }
  .cal-cell .amt{ font-size:9px; color:var(--text-sub); display:block; margin-top:2px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-sub); margin-top:10px; }
  .legend .sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .filter-row select, .filter-row input{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:13px; }

  /* ---- Modal ---- */
  #modalOverlay{ display:none; position:fixed; inset:0; background:rgba(20,20,15,.45); align-items:center; justify-content:center; padding:20px; z-index:50; }
  #modalOverlay.show{ display:flex; }
  .modal-box{ background:var(--surface); border-radius:var(--radius); padding:16px; width:100%; max-width:360px; max-height:70vh; overflow-y:auto; }
  .modal-box .mh{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .modal-box .mh span{ font-weight:700; font-size:15px; }
  .modal-box .mh button{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-sub); }
  .swipe-row{ position:relative; overflow:hidden; border-bottom:1px solid var(--border); }
  .swipe-inner{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; background:var(--surface); transition:transform .15s; touch-action:pan-y; }
  .swipe-del{ position:absolute; right:0; top:0; bottom:0; width:70px; background:var(--danger); color:#fff; border:none; font-size:13px; }
  .swipe-inner .cat{ font-size:13px; }
  .swipe-inner .amt{ font-size:13px; font-weight:600; }
  .swipe-inner .amt.plus{ color:var(--success); }
  .swipe-inner .amt.minus{ color:var(--danger); }

  /* ---- Input screen ---- */
  .type-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .type-toggle button{ flex:1; padding:10px 0; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-weight:600; font-size:14px; cursor:pointer; color:var(--text-sub); }
  .type-toggle button.active.expense{ background:var(--danger-bg); border-color:var(--danger-strong); color:var(--danger); }
  .type-toggle button.active.income{ background:var(--success-bg); border-color:var(--success); color:var(--success); }
  .type-toggle button.active.advance{ background:var(--accent-bg); border-color:var(--primary); color:var(--primary); }
  .field select{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); }

  /* ---- Summary ---- */
  #rangeBtn{ width:100%; text-align:left; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; cursor:pointer; font-size:13px; color:var(--text); }
  #rangeCalWrap{ display:none; margin-bottom:14px; }
  .pie-wrap{ display:flex; justify-content:center; margin-bottom:14px; }
  .pie-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; justify-content:center; font-size:12px; margin-bottom:18px; }
  .bar-chart{ display:flex; align-items:flex-end; gap:4px; height:100px; border-top:1px solid var(--border); padding-top:6px; }
  .bar-chart .bar{ flex:1; background:var(--danger-strong); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .bar-chart .bar.income{ background:var(--success); }
  .no-data{ color:var(--text-sub); font-size:13px; text-align:center; padding:30px 0; }

  /* ---- Edit screen ---- */
  .section-label{ font-size:12px; color:var(--text-sub); margin:18px 0 8px; }
  .section-label:first-child{ margin-top:0; }
  .list-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .list-row .l{ display:flex; align-items:center; gap:8px; flex:1; }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .icon-btn{ background:none; border:none; color:var(--text-sub); cursor:pointer; padding:4px; }
  .add-btn{ width:100%; margin-top:10px; padding:10px 0; background:var(--accent-bg); border:1px dashed var(--primary); border-radius:var(--radius-sm); color:var(--primary); font-size:13px; cursor:pointer; }
  .cat-row{ cursor:grab; }
  .cat-row.dragging{ opacity:.4; }
  .heading-block.dragging, .shop-item.dragging{ opacity:.4; }
  .continue-btn{ width:100%; margin-top:14px; padding:12px 0; background:var(--accent-bg); border:1px solid var(--primary); border-radius:var(--radius-sm); color:var(--primary); font-weight:600; font-size:14px; cursor:pointer; }

  /* ---- サブ画面共通 ---- */
  .back-header{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .back-header button{ background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:2px 6px 2px 0; }
  .back-header h2{ margin:0; font-size:18px; font-weight:700; }

  /* ---- 予算 ---- */
  .budget-row{ margin-bottom:12px; }
  .budget-row .bh{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
  .budget-track{ height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .budget-fill{ height:100%; border-radius:4px; }

  /* ---- 立て替え ---- */
  .adv-filter{ display:flex; gap:8px; margin-bottom:12px; }
  .adv-filter select{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:13px; color:var(--text); }
  .adv-card{ padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .adv-card .t1{ display:flex; justify-content:space-between; font-size:14px; }
  .adv-card .t2{ display:flex; justify-content:space-between; align-items:center; margin-top:3px; font-size:12px; color:var(--text-sub); }
  .status-pill{ font-size:10px; padding:3px 9px; border-radius:20px; }
  .status-pill.unsettled{ background:var(--danger-bg); color:var(--danger); }
  .status-pill.settled{ background:var(--success-bg); color:var(--success); }
  .receipt-thumb{ width:36px; height:36px; object-fit:cover; border-radius:6px; margin-left:8px; }
  .link-btn{ background:none; border:none; color:var(--primary); font-size:12px; text-decoration:underline; cursor:pointer; padding:0; }

  /* ---- 買い物リスト ---- */
  .heading-block{ margin-bottom:18px; }
  .heading-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border-strong,var(--border)); cursor:grab; }
  .heading-items{ min-height:4px; }
  .add-item-row{ display:flex; gap:8px; margin-top:8px; }
  .add-item-row input{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); font-size:13px; }
  .add-item-row button{ padding:0 14px; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); font-size:13px; }
  .shop-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .shop-item input[type=checkbox]{ width:19px; height:19px; accent-color:var(--primary); }
  .shop-item.done{ opacity:0.6; }
  .shop-item.done span.iname{ text-decoration:line-through; color:var(--text-sub); }

  /* ---- Form modal (used for goal/fixedcost/category edit) ---- */
  .form-field{ margin-bottom:12px; }
  .form-field label{ display:block; font-size:12px; color:var(--text-sub); margin-bottom:4px; }
  .form-field input, .form-field select{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .form-actions{ display:flex; gap:8px; margin-top:14px; }
  .form-actions button{ flex:1; padding:10px 0; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; }
  .form-actions .save{ background:var(--primary); color:#fff; border:none; font-weight:600; }
  .form-actions .cancel{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .form-actions .delete{ background:var(--danger-bg); border:1px solid var(--danger-strong); color:var(--danger); }
  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-swatches .cs{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-swatches .cs.sel{ border-color:var(--text); }
</style>
</head>
<body>

<div id="app">

  <!-- ===== Auth screen ===== -->
  <div id="authScreen">
    <h1>家計簿</h1>
    <p class="sub" id="authSub">ログインして始めましょう</p>
    <div class="field"><label>メールアドレス</label><input type="email" id="authEmail" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input type="password" id="authPass" autocomplete="current-password"></div>
    <button class="btn-primary" id="authSubmit">ログイン</button>
    <div id="authError"></div>
    <div id="authToggle">アカウントをお持ちでない方はこちら(新規登録)</div>
  </div>

  <!-- ===== Main shell ===== -->
  <div id="shell">
    <div id="screenArea"></div>

    <div id="tabbar">
      <button class="tab-btn" data-screen="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>ホーム</span></button>
      <button class="tab-btn" data-screen="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>入力</span></button>
      <button class="tab-btn" data-screen="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg><span>集計</span></button>
      <button class="tab-btn" data-screen="shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l1.5 6M18 2l-1.5 6M3.5 8h17l-1.6 10.3a2 2 0 01-2 1.7H7.1a2 2 0 01-2-1.7L3.5 8z"/></svg><span>買い物</span></button>
      <button class="tab-btn" data-screen="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>編集</span></button>
    </div>
  </div>
</div>

<div id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, deleteDoc, updateDoc,
  onSnapshot, getDoc, query
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== Firebase 設定(ご提供いただいた設定値) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDwzagh2cBu8WthlHoa645Ss-Q3bnnqVcM",
  authDomain: "money-app-7c219.firebaseapp.com",
  projectId: "money-app-7c219",
  storageBucket: "money-app-7c219.firebasestorage.app",
  messagingSenderId: "627770579382",
  appId: "1:627770579382:web:0d6b764336495f81360917"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
setPersistence(auth, browserLocalPersistence);

/* ====== 状態 ====== */
const state = {
  uid: null,
  screen: 'home',
  prevScreen: 'edit',
  transactions: [],
  categories: [],
  fixedCosts: [],
  budgets: [],
  advances: [],
  advanceContacts: [],
  shoppingHeadings: [],
  shoppingItems: [],
  goals: [],
  monthStartDay: 1,
  calMonth: new Date(),
  calFilter: { category: 'all' },
  sumRange: null,
  sumRangeManual: false,
  rangePicking: null,
  authMode: 'login',
  advanceFilter: { person: 'all', status: 'all' },
  listFilter: { start:'', end:'', expense:true, income:true, advance:true },
  listFilterManual: false
};
const toLocalStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => toLocalStr(new Date());
const yen = n => (n<0?'-':'') + Math.abs(Math.round(n)).toLocaleString('ja-JP') + '円';
const parseAmt = v => parseFloat(String(v||'').replace(/[^0-9.]/g,'')) || 0;
document.addEventListener('input', e=>{
  if(e.target.classList && e.target.classList.contains('amt-input')){
    const digits = e.target.value.replace(/[^0-9]/g,'');
    e.target.value = digits ? parseInt(digits,10).toLocaleString('ja-JP') : '';
  }
});
const DEFAULT_CATS = [
  {name:'固定費', type:'expense', color:'#FF5D5D', order:0},
  {name:'流動費', type:'expense', color:'#FF9F40', order:1},
  {name:'その他', type:'expense', color:'#C9A0FF', order:2},
  {name:'給与', type:'income', color:'#2FE0A6', order:0},
  {name:'副業', type:'income', color:'#3DC6F0', order:1},
  {name:'その他', type:'income', color:'#C9A0FF', order:2},
];
const PALETTE = ['#FF5D5D','#FF9F40','#FFD23F','#2FE0A6','#3DC6F0','#5D7DFF','#C9A0FF','#FF6FB0'];

/* ====== Auth ====== */
const authScreen = document.getElementById('authScreen');
const shell = document.getElementById('shell');
document.getElementById('authSubmit').addEventListener('click', submitAuth);
document.getElementById('authToggle').addEventListener('click', () => {
  state.authMode = state.authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authSubmit').textContent = state.authMode === 'login' ? 'ログイン' : '新規登録';
  document.getElementById('authSub').textContent = state.authMode === 'login' ? 'ログインして始めましょう' : '新しいアカウントを作成します';
  document.getElementById('authToggle').textContent = state.authMode === 'login' ? 'アカウントをお持ちでない方はこちら(新規登録)' : 'すでにアカウントをお持ちの方はこちら(ログイン)';
});
async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  try{
    if(state.authMode === 'login'){
      await signInWithEmailAndPassword(auth, email, pass);
    }else{
      await createUserWithEmailAndPassword(auth, email, pass);
    }
  }catch(e){
    errEl.textContent = translateAuthError(e.code);
  }
}
function translateAuthError(code){
  const map = {
    'auth/invalid-email':'メールアドレスの形式が正しくありません',
    'auth/user-not-found':'アカウントが見つかりません',
    'auth/wrong-password':'パスワードが違います',
    'auth/invalid-credential':'メールアドレスかパスワードが違います',
    'auth/email-already-in-use':'このメールアドレスは既に登録されています',
    'auth/weak-password':'パスワードは6文字以上にしてください',
  };
  return map[code] || 'エラーが発生しました。もう一度お試しください';
}

let unsubs = [];
onAuthStateChanged(auth, async (user) => {
  unsubs.forEach(u=>u()); unsubs = [];
  if(user){
    state.uid = user.uid;
    authScreen.style.display = 'none';
    shell.style.display = 'flex';
    await ensureDefaultCategories();
    listenAll();
  }else{
    state.uid = null;
    authScreen.style.display = 'flex';
    shell.style.display = 'none';
  }
});

async function ensureDefaultCategories(){
  const ref = doc(db, 'users', state.uid, 'meta', 'init');
  const snap = await getDoc(ref);
  if(!snap.exists()){
    for(const c of DEFAULT_CATS){
      await addDoc(collection(db,'users',state.uid,'categories'), c);
    }
    await setDoc(ref, {done:true});
  }
}

function listenAll(){
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'transactions'), snap => {
    state.transactions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'categories'), snap => {
    state.categories = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.order-b.order);
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'fixedCosts'), snap => {
    state.fixedCosts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'budgets'), snap => {
    state.budgets = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'advances'), snap => {
    state.advances = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'advanceContacts'), snap => {
    state.advanceContacts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'shoppingHeadings'), snap => {
    state.shoppingHeadings = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'shoppingItems'), snap => {
    state.shoppingItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(doc(db,'users',state.uid,'meta','settings'), snap => {
    state.monthStartDay = snap.exists() ? (snap.data().monthStartDay||1) : 1;
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'users',state.uid,'goals'), snap => {
    state.goals = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===state.screen));
  const area = document.getElementById('screenArea');
  if(state.screen==='home') area.innerHTML = renderHome();

/* ---------- ホーム ---------- */
function getCurrentPeriod(){
  const s = Math.min(28, Math.max(1, state.monthStartDay||1));
  const now = new Date();
  let start;
  if(now.getDate() >= s) start = new Date(now.getFullYear(), now.getMonth(), s);
  else start = new Date(now.getFullYear(), now.getMonth()-1, s);
  const end = new Date(start.getFullYear(), start.getMonth()+1, s);
  return { start: toLocalStr(start), end: toLocalStr(end), startDate: start, endDate: end };
}
function renderHome(){
  const period = getCurrentPeriod();
  const thisMonth = state.transactions.filter(t=> t.date>=period.start && t.date<period.end);
  const monthBalance = thisMonth.reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount), 0);
  const monthIncome = thisMonth.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const monthExpense = thisMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const allBalance = state.transactions.reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount), 0);
  const allocatedTotal = state.goals.reduce((s,g)=>s+(g.allocatedAmount||0),0);
  const unallocated = allBalance - allocatedTotal;

  const today = new Date();
  const fixedWithDays = state.fixedCosts.map(f=>{
    let next = new Date(today.getFullYear(), today.getMonth(), f.day);
    if(next < new Date(today.getFullYear(),today.getMonth(),today.getDate())) next.setMonth(next.getMonth()+1);
    const days = Math.round((next-today)/86400000);
    return {...f, days, nextDate: next};
  }).sort((a,b)=>a.days-b.days);

  const budgetRows = computeBudgetRows();
  const remainingBudgetTotal = budgetRows.reduce((s,r)=> s + Math.max(0, r.amount - r.spent), 0);
  const projectedExpense = monthExpense + remainingBudgetTotal;
  const projectedBalance = allBalance - remainingBudgetTotal;
  const unsettledAdv = state.advances.filter(a=>!a.settled);
  const advTotal = unsettledAdv.reduce((s,a)=>s+a.amount,0);

  return `
    <h2 class="screen-title">ホーム</h2>
    <div class="card">
      <div class="card-label">貯蓄残高</div>
      <div class="card-value">${yen(Math.max(0,allBalance))}</div>
      <div style="font-size:11px;color:var(--text-sub);margin-top:4px;">うち未配分:${yen(unallocated)}</div>
    </div>
    ${state.goals.length ? `
    <div class="card">
      <div class="card-label">貯蓄目標</div>
      ${state.goals.map(g=>{
        const pct = g.targetAmount>0 ? Math.min(100,Math.max(0,(g.allocatedAmount||0)/g.targetAmount*100)) : 0;
        return `
        <div class="budget-row">
          <div class="bh"><span>${escapeHtml(g.name)}</span><span>${yen(g.allocatedAmount||0)} / ${yen(g.targetAmount)}</span></div>
          <div class="budget-track"><div class="budget-fill" style="width:${pct}%;background:var(--primary)"></div></div>
        </div>`;
      }).join('')}
    </div>` : ''}
    <div class="card-label" style="margin-bottom:-2px;">${period.startDate.getMonth()+1}/${period.startDate.getDate()} 〜 ${period.endDate.getMonth()+1}/${period.endDate.getDate()-1}</div>
    <div class="row2">
      <div class="card"><div class="card-label">今月の収入</div><div class="card-value" style="color:var(--success)">+${yen(monthIncome)}</div></div>
      <div class="card">
        <div class="card-label">今月の支出</div>
        <div class="card-value" style="color:var(--danger)">-${yen(monthExpense)}</div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:2px;">予算消化時見込み:${yen(projectedExpense)}</div>
      </div>
    </div>
    <div class="row2">
      <div class="card"><div class="card-label">今月の収支</div><div class="card-value" style="color:${monthBalance>=0?'var(--success)':'var(--danger)'}">${monthBalance>=0?'+':''}${yen(monthBalance)}</div></div>
      <div class="card">
        <div class="card-label">使える残り</div>
        <div class="card-value">${yen(allBalance)}</div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:2px;">予算消化時見込み:${yen(projectedBalance)}</div>
      </div>
    </div>
    ${budgetRows.length ? `
    <div class="card">
      <div class="card-label">予算の状況</div>
      ${budgetRows.map(r=>`
        <div class="budget-row">
          <div class="bh"><span>${escapeHtml(r.name)}</span><span>${yen(r.spent)} / ${yen(r.amount)}</span></div>
          <div class="budget-track"><div class="budget-fill" style="width:${Math.min(100,r.pct)}%;background:${r.color}"></div></div>
        </div>`).join('')}
    </div>` : ''}
    <div class="card">
      <div class="card-label">固定費の支払い予定</div>
      ${fixedWithDays.length ? fixedWithDays.map(f=>`
        <div class="fixed-item">
          <div class="top"><span>${escapeHtml(f.name)}</span><span class="days-left ${f.days<=3?'soon':''}">あと${f.days}日</span></div>
          <div class="bottom"><span>${f.nextDate.getMonth()+1}/${f.nextDate.getDate()}・${yen(f.amount)}</span><span class="tag">${escapeHtml(f.method||'未設定')}</span></div>
        </div>`).join('') : '<div class="no-data">固定費が登録されていません(編集画面から登録できます)</div>'}
    </div>
    <div class="card" id="advSummaryCard" style="cursor:pointer;">
      <div class="card-label">立て替え(未精算)</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span class="card-value" style="color:${unsettledAdv.length?'var(--danger)':'var(--text)'}">${yen(advTotal)}</span>
        <span style="font-size:12px;color:var(--text-sub);">${unsettledAdv.length}件 ›</span>
      </div>
    </div>
  `;
}

/* ---------- カレンダー ---------- */
function renderCalendar(){
  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  const catOptions = ['<option value="all">すべてのカテゴリ</option>']
    .concat(state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`)).join('');

  const dayTotals = {}, dayIncome = {};
  state.transactions.forEach(t=>{
    if(state.calFilter.category!=='all' && t.category!==state.calFilter.category) return;
    const [ty,tm,td] = t.date.split('-').map(Number);
    if(ty!==y || (tm-1)!==m) return;
    if(t.type==='expense') dayTotals[td] = (dayTotals[td]||0) + t.amount;
    else dayIncome[td] = (dayIncome[td]||0) + t.amount;
  });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const amt = dayTotals[day]||0;
    const inc = dayIncome[day]||0;
    let bg = 'transparent';
    if(amt>=10000) bg = 'var(--danger-strong)';
    else if(amt>0) bg = 'var(--danger-bg)';
    cells += `<div class="cal-cell" data-day="${day}" style="background:${bg}">
      <div>${day}</div>
      ${amt>0?`<span class="amt">${amt>=10000?'-'+Math.round(amt/1000)+'k':'-'+amt.toLocaleString()}</span>`:''}
      ${inc>0?`<span class="amt" style="color:var(--success)">+${inc>=10000?Math.round(inc/1000)+'k':inc.toLocaleString()}</span>`:''}
    </div>`;
  }

  return `
    <h2 class="screen-title">カレンダー</h2>
    <div class="filter-row">
      <select id="calCatFilter">${catOptions}</select>
    </div>
    <div class="cal-header">
      <button id="calPrev">‹</button>
      <span class="ym">${y}年${m+1}月</span>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid">
      ${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="legend">
      <span><span class="sw" style="background:var(--danger-strong)"></span>1万円以上の支出</span>
      <span><span class="sw" style="background:var(--danger-bg)"></span>支出あり</span>
      <span><span class="sw" style="background:var(--success)"></span>収入あり(緑数字)</span>
    </div>
  `;
}

/* ---------- 集計 ---------- */
function renderSummary(){
  if(!state.sumRangeManual){
    const period = getCurrentPeriod();
    const endInclusive = new Date(period.endDate); endInclusive.setDate(endInclusive.getDate()-1);
    state.sumRange = { start: period.start, end: toLocalStr(endInclusive) };
  }
  const {start,end} = state.sumRange;
  const inRange = t => t.date>=start && t.date<=end;
  const expenses = state.transactions.filter(t=>t.type==='expense' && inRange(t));
  const incomes = state.transactions.filter(t=>t.type==='income' && inRange(t));
  const incomeTotal = incomes.reduce((s,t)=>s+t.amount,0);
  const totalsByCat = {};
  expenses.forEach(t=>{ totalsByCat[t.category] = (totalsByCat[t.category]||0)+t.amount; });
  const catEntries = Object.entries(totalsByCat).map(([id,amt])=>{
    const c = state.categories.find(c=>c.id===id);
    return { name: c?c.name:'不明', color: c?c.color:'#999', amt };
  });
  const total = catEntries.reduce((s,c)=>s+c.amt,0);

  let gradient = '', acc = 0;
  catEntries.forEach(c=>{
    const pct = total>0 ? c.amt/total*100 : 0;
    gradient += `${c.color} ${acc}% ${acc+pct}%, `;
    acc += pct;
  });
  gradient = gradient.slice(0,-2) || 'var(--surface-2) 0% 100%';

  // 日別の収支推移(期間内)
  const days = [];
  const [sy,sm,sd] = start.split('-').map(Number), [ey,em,ed] = end.split('-').map(Number);
  let d0 = new Date(sy,sm-1,sd), d1 = new Date(ey,em-1,ed);
  for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)) days.push(toLocalStr(d));
  const dayVals = days.map(day=>{
    const exp = state.transactions.filter(t=>t.type==='expense'&&t.date===day).reduce((s,t)=>s+t.amount,0);
    const inc = state.transactions.filter(t=>t.type==='income'&&t.date===day).reduce((s,t)=>s+t.amount,0);
    return inc - exp;
  });
  const maxVal = Math.max(1, ...dayVals.map(v=>Math.abs(v)));

  return `
    <h2 class="screen-title">集計</h2>
    <div class="card-label">集計期間</div>
    <button id="rangeBtn"><span>${start} 〜 ${end}</span><span>📅</span></button>
    <div id="rangeCalWrap">${renderRangeCalendar()}</div>
    <div class="row2" style="margin-bottom:14px;">
      <div class="card"><div class="card-label">期間の収入</div><div class="card-value" style="color:var(--success)">+${yen(incomeTotal)}</div></div>
      <div class="card"><div class="card-label">期間の支出</div><div class="card-value" style="color:var(--danger)">-${yen(total)}</div></div>
    </div>
    ${total>0 ? `
      <div class="card-label">支出のカテゴリ内訳</div>
      <div class="pie-wrap"><div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${gradient});"></div></div>
      <div class="pie-legend">${catEntries.map(c=>`<span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.color};margin-right:4px;"></span>${escapeHtml(c.name)} ${yen(c.amt)}</span>`).join('')}</div>
    ` : ''}
    <div class="card-label">期間内の収支推移</div>
    ${dayVals.some(v=>v!==0) ? `<div class="bar-chart">${dayVals.map(v=>`<div class="bar ${v>=0?'income':''}" style="height:${Math.max(3,Math.abs(v)/maxVal*100)}%"></div>`).join('')}</div>` : '<div class="no-data">この期間の記録がありません</div>'}
  `;
}
function renderRangeCalendar(){
  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const {start,end} = state.sumRange;
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const inRange = dateStr>=start && dateStr<=end;
    cells += `<div class="cal-cell rangeday" data-date="${dateStr}" style="background:${inRange?'var(--accent-bg)':'transparent'}"><div>${day}</div></div>`;
  }
  return `
    <div class="cal-header">
      <button id="rcPrev">‹</button><span class="ym">${y}年${m+1}月(開始日→終了日の順にタップ)</span><button id="rcNext">›</button>
    </div>
    <div class="cal-grid">${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  `;
}

/* ---------- 予算(ホーム画面表示用) ---------- */
function computeBudgetRows(){
  const period = getCurrentPeriod();
  return state.budgets.map(b=>{
    const cat = state.categories.find(c=>c.id===b.categoryId);
    const spent = state.transactions.filter(t=>t.type==='expense' && t.category===b.categoryId && t.date>=period.start && t.date<period.end).reduce((s,t)=>s+t.amount,0);
    const pct = b.amount>0 ? spent/b.amount*100 : 0;
    let color = 'var(--primary)';
    if(pct>=100) color = 'var(--danger)';
    else if(pct>=80) color = '#FFD23F';
    return { id:b.id, name: cat?cat.name:'不明なカテゴリ', amount:b.amount, spent, pct, color };
  });
}

/* ---------- 立て替え管理 ---------- */
function renderAdvances(){
  const f = state.advanceFilter;
  let list = state.advances.slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(f.person!=='all') list = list.filter(a=>a.person===f.person);
  if(f.status!=='all') list = list.filter(a=>(f.status==='settled')===!!a.settled);
  const unsettledTotal = state.advances.filter(a=>!a.settled).reduce((s,a)=>s+a.amount,0);
  return `
    <div class="back-header"><button id="backBtn">‹</button><h2>立て替え管理</h2></div>

/* ---------- 一覧 ---------- */
function renderList(){
  const f = state.listFilter;
  if(!state.listFilterManual){
    const period = getCurrentPeriod();
    const endInclusive = new Date(period.endDate); endInclusive.setDate(endInclusive.getDate()-1);
    f.start = period.start; f.end = toLocalStr(endInclusive);
  }
  let records = [];
  state.transactions.forEach(t=>{
    if(t.type==='expense' && !f.expense) return;
    if(t.type==='income' && !f.income) return;
    const cat = state.categories.find(c=>c.id===t.category);
    records.push({ id:t.id, kind:'transaction', type:t.type, date:t.date, label: cat?cat.name:'不明', memo:t.memo, amount:t.amount });
  });
  if(f.advance){
    state.advances.forEach(a=>{
      records.push({ id:a.id, kind:'advance', type:'advance', date:a.date, label:'立替・'+a.person, memo:a.memo, amount:a.amount, settled:a.settled });
    });
  }
  if(f.start) records = records.filter(r=>r.date>=f.start);
  if(f.end) records = records.filter(r=>r.date<=f.end);
  records.sort((a,b)=> b.date.localeCompare(a.date));

  return `
    <h2 class="screen-title">一覧</h2>
    <div class="filter-row">
      <input type="date" id="listStart" value="${f.start}">
      <input type="date" id="listEnd" value="${f.end}">
    </div>
    <div style="display:flex;gap:14px;margin-bottom:14px;font-size:13px;">
      <label><input type="checkbox" id="fExpense" ${f.expense?'checked':''} style="width:auto;margin-right:4px;">支出</label>
      <label><input type="checkbox" id="fIncome" ${f.income?'checked':''} style="width:auto;margin-right:4px;">収入</label>
      <label><input type="checkbox" id="fAdvance" ${f.advance?'checked':''} style="width:auto;margin-right:4px;">立替</label>
    </div>
    ${records.length ? records.map(r=>`
      <div class="list-record-row" data-id="${r.id}" data-kind="${r.kind}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="flex:1;">
          <div style="font-size:13px;">${escapeHtml(r.label)}${r.memo?'・'+escapeHtml(r.memo):''}</div>
          <div style="font-size:11px;color:var(--text-sub);">${r.date}${r.kind==='advance'?(r.settled?'・精算済み':'・未精算'):''}</div>
        </div>
        <div style="font-weight:600;font-size:13px;color:${r.type==='income'?'var(--success)':(r.type==='expense'?'var(--danger)':'var(--text)')};margin-right:10px;">${r.type==='income'?'+':'-'}${yen(r.amount)}</div>
        <span class="icon-btn list-edit" data-id="${r.id}" data-kind="${r.kind}">✎</span>
        <span class="icon-btn list-del" data-id="${r.id}" data-kind="${r.kind}" style="margin-left:4px;">✕</span>
      </div>`).join('') : '<div class="no-data">該当する記録がありません</div>'}
  `;
}

function catRow(c){

    <div class="l"><span style="cursor:grab;">⠿</span><span class="dot" style="background:${c.color}"></span><span>${escapeHtml(c.name)}</span></div>

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function attachRangeCalEvents(){
  const prev = document.getElementById('rcPrev'), next = document.getElementById('rcNext');
  if(prev) prev.onclick = ()=>{ state.calMonth.setMonth(state.calMonth.getMonth()-1); document.getElementById('rangeCalWrap').innerHTML = renderRangeCalendar(); attachRangeCalEvents(); };
  if(next) next.onclick = ()=>{ state.calMonth.setMonth(state.calMonth.getMonth()+1); document.getElementById('rangeCalWrap').innerHTML = renderRangeCalendar(); attachRangeCalEvents(); };
  document.querySelectorAll('.rangeday').forEach(cell=>{
    cell.onclick = ()=>{
      const date = cell.dataset.date;
      state.sumRangeManual = true;
      if(state.rangePicking==='start' || !state.rangePicking){
        state.sumRange = { start: date, end: date };
        state.rangePicking = 'end';
      }else{
        if(date < state.sumRange.start){ state.sumRange = {start:date, end:state.sumRange.start}; }
        else { state.sumRange.end = date; }
        state.rangePicking = 'start';
      }
      render();
      document.getElementById('rangeCalWrap').style.display='block';
    };
  });
}

/* ---- 日別内訳モーダル(カレンダー、スワイプ削除つき) ---- */
function openDayModal(day){
  const y = state.calMonth.getFullYear(), m = state.calMonth.getMonth();
  const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const items = state.transactions.filter(t=>t.date===dateStr);
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="mh"><span>${m+1}月${day}日の内訳</span><button id="mClose">✕</button></div>
    ${items.length ? items.map(t=>{
      const cat = state.categories.find(c=>c.id===t.category);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);">
        <span style="font-size:13px;">${escapeHtml(cat?cat.name:'不明')}${t.memo?'・'+escapeHtml(t.memo):''}</span>
        <span style="font-size:13px;font-weight:600;color:${t.type==='income'?'var(--success)':'var(--danger)'}">${t.type==='income'?'+':'-'}${yen(t.amount)}</span>
      </div>`;
    }).join('') : '<div class="no-data">記録がありません</div>'}
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('mClose').onclick = closeModal;
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function attachSwipeDelete(){
  document.querySelectorAll('.swipe-row').forEach(row=>{
    const inner = row.querySelector('.swipe-inner');
    const delBtn = row.querySelector('.swipe-del');
    let startX=0, curX=0, dragging=false;
    inner.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; dragging=true; }, {passive:true});
    inner.addEventListener('touchmove', e=>{
      if(!dragging) return;
      curX = e.touches[0].clientX - startX;
      if(curX<0) inner.style.transform = `translateX(${Math.max(curX,-70)}px)`;
    }, {passive:true});
    inner.addEventListener('touchend', ()=>{
      dragging=false;
      inner.style.transform = curX < -35 ? 'translateX(-70px)' : 'translateX(0)';
      curX=0;
    });
    delBtn.onclick = async ()=>{
      await deleteDoc(doc(db,'users',state.uid,'transactions',row.dataset.id));
      row.remove();
    };
  });
}

/* ---- 入力保存 ---- */
async function saveTransaction(keepGoing){
  const amt = parseAmt(document.getElementById('inAmt').value);
  const date = document.getElementById('inDate').value;
  const memo = document.getElementById('inMemo').value;
  const msg = document.getElementById('inMsg');
  if(!amt || amt<=0){ msg.textContent = '金額を正しく入力してください'; return; }
  if(!date){ msg.textContent = '日付を選択してください'; return; }

  if(inputType==='advance'){
    let person = document.getElementById('inPersonSel').value;
    if(person==='__new__'){
      person = document.getElementById('inPersonNew').value.trim();
      if(!person){ msg.textContent = '相手の名前を入力してください'; return; }
      if(!state.advanceContacts.some(c=>c.name===person)){
        await addDoc(collection(db,'users',state.uid,'advanceContacts'), { name: person });
      }
    }
    await addDoc(collection(db,'users',state.uid,'advances'), { person, amount:amt, date, memo, settled:false, receiptImg:null });
  }else{
    const cat = document.getElementById('inCat').value;
    if(!cat){ msg.textContent = 'カテゴリを選択してください'; return; }
    await addDoc(collection(db,'users',state.uid,'transactions'), { type:inputType, category:cat, amount:amt, date, memo, createdAt:Date.now() });
  }

  if(keepGoing){
    document.getElementById('inAmt').value='';
    document.getElementById('inMemo').value='';
    msg.textContent = '保存しました。続けて入力できます';
  }else{
    state.screen='home'; render();
  }
}

/* ---- カテゴリ並べ替え(ドラッグ&ドロップ) ---- */
function attachDragReorder(){
  ['expCatList','incCatList'].forEach(listId=>{
    const list = document.getElementById(listId);
    if(!list) return;
    let dragEl = null;
    list.querySelectorAll('.cat-row').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragEl = row; row.classList.add('dragging'); });
      row.addEventListener('dragend', async ()=>{
        row.classList.remove('dragging');
        const ids = [...list.querySelectorAll('.cat-row')].map(r=>r.dataset.id);
        await Promise.all(ids.map((id,idx)=> updateDoc(doc(db,'users',state.uid,'categories',id), {order:idx}) ));
      });
      row.addEventListener('dragover', e=>{
        e.preventDefault();
        const after = getDragAfterElement(list, e.clientY);
        if(!dragEl) return;
        if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl, after);
      });
    });
  });
}
function getDragAfterElement(container, y){
  const els = [...container.querySelectorAll('.cat-row:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element: child};
    else return closest;
  }, {offset: -Infinity}).element;
}

/* ====== 立て替えフォーム ====== */
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function copyAdvanceListText(){
  const f = state.advanceFilter;
  let list = state.advances.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(f.person!=='all') list = list.filter(a=>a.person===f.person);
  if(f.status!=='all') list = list.filter(a=>(f.status==='settled')===!!a.settled);
  const lines = list.map(a=>`${a.date}　${a.person}　${yen(a.amount)}${a.memo?'　'+a.memo:''}${a.settled?'　(精算済み)':''}`);
  const total = list.filter(a=>!a.settled).reduce((s,a)=>s+a.amount,0);
  const text = lines.join('\n') + `\n\n未精算合計: ${yen(total)}`;
  try{
    await navigator.clipboard.writeText(text);
    alert('コピーしました');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('コピーしました');
  }
}
